[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Defaults (pyflakes + core pycodestyle) plus import sorting, bugbear, pyupgrade.
extend-select = ["I", "B", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
